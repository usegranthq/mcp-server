name: Release

on:
  push:
    branches:
      - master

concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  NODE_VERSION: 24
  HUSKY: 0

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # changesets/action has no version placeholder for the PR title and commit message
      - name: Get Release Version
        id: version
        run: |
          npx changeset status --output="$RUNNER_TEMP/changeset-status.json" || true
          echo "version=$(node -p "require(process.env.RUNNER_TEMP + '/changeset-status.json').releases[0]?.newVersion ?? ''" 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npx changeset publish
          pr-title: Release v${{ steps.version.outputs.version }}
          commit-message: Release v${{ steps.version.outputs.version }}
