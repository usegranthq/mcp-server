name: Tests

env:
  NODE_VERSION: 24
  HUSKY: 0

on:
  push:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Using node v-${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VERSION}}
          cache: npm

      - name: NPM Install
        run: npm ci

      - name: Build
        run: npm run build
